name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Test
        run: npm test

      - name: Validate package
        run: npm pack --dry-run

      - name: Prepare GitHub release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check for an unpublished GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node --print "require('./package.json').name")
          version=$(node --print "require('./package.json').version")
          echo "required=false" >> "$GITHUB_OUTPUT"
          gh release view "v$version" >/dev/null 2>&1 || exit 0
          npm view "$name@$version" version >/dev/null 2>&1 && exit 0
          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Install npm with trusted publishing support
        if: ${{ steps.publish.outputs.required == 'true' }}
        run: npm install --global "npm@^11.5.1"

      - name: Publish to npm
        if: ${{ steps.publish.outputs.required == 'true' }}
        run: npm publish
