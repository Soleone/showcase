<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Try it in your browser</title>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@webcontainer/api@1.6.4/+esm" crossorigin>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/+esm" crossorigin>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/+esm" crossorigin>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/+esm" crossorigin>
  <link rel="preload" href="files.json" as="fetch" crossorigin>
  <link rel="preload" href="terminal.json" as="fetch" crossorigin>
  <link rel="preload" href="themes.json" as="fetch" crossorigin>
  <link rel="preload" href="fonts/JetBrainsMonoNerdFontMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/JetBrainsMonoNerdFontMono-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css" crossorigin>
  <script>
    // Puts the visitor's theme on before first paint (themes.js saves the resolved colors when one is picked).
    try {
      const saved = JSON.parse(localStorage.getItem("browser-terminal.theme"));
      for (const [name, value] of Object.entries(saved.vars)) document.documentElement.style.setProperty(`--${name}`, value);
      document.documentElement.style.colorScheme = document.documentElement.dataset.theme = saved.mode;
    } catch {}
  </script>
  <style>
    /* JetBrains Mono with Nerd Font icons (SIL OFL, fonts/OFL.txt), self-hosted; see fonts/build.sh. */
    @font-face {
      font-family: "JetBrainsMono Nerd Font Mono";
      src: url("fonts/JetBrainsMonoNerdFontMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: "JetBrainsMono Nerd Font Mono";
      src: url("fonts/JetBrainsMonoNerdFontMono-Bold.woff2") format("woff2");
      font-weight: 700;
      font-display: block;
    }
    /* The fallback look, gold on cool obsidian, until themes.json has applied a theme. */
    :root {
      color-scheme: dark;
      --page: #0D0F12;
      --ink: #D8D1C0;
      --ink-strong: #F5EBD2;
      --muted: #918977;
      --accent: #D4AF37;
      --surface: #181B20;
      --line: #342D1B;
      --terminal: #090A0C;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --page: #F5EBD2;
        --ink: #0D0F12;
        --ink-strong: #0D0F12;
        --muted: #716957;
        --accent: #8A6240;
        --surface: #E6DECB;
        --line: #D8D1C0;
      }
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page: #F5EBD2;
      --ink: #0D0F12;
      --ink-strong: #0D0F12;
      --muted: #716957;
      --accent: #8A6240;
      --surface: #E6DECB;
      --line: #D8D1C0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--page);
      color: var(--ink);
      font: 16px/1.5 Geist, ui-sans-serif, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header, main, footer { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 16px; }
    header { padding-top: 32px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
    h1 { margin: 0; color: var(--ink-strong); font-size: clamp(28px, 5vw, 44px); font-weight: 600; line-height: 1.05; letter-spacing: -0.03em; }
    .pitch { margin: 8px 0 0; color: var(--muted); font-size: 17px; max-width: 62ch; text-wrap: pretty; }
    a { color: var(--accent); text-underline-offset: 3px; }
    .tools { display: flex; align-items: center; gap: 16px; position: relative; }
    .repo { font-size: 15px; white-space: nowrap; }
    #theme-button {
      font: 13px/1 Geist, ui-sans-serif, system-ui, sans-serif;
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface); color: var(--ink);
      border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; cursor: pointer;
    }
    #theme-button:hover, #theme-button:focus-visible, #theme-button[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); outline: none; }
    .swatch { display: inline-flex; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); flex: none; }
    .swatch i { width: 9px; height: 14px; display: block; }
    #theme-list {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 10; width: 240px; max-height: min(60vh, 420px); overflow: auto;
      margin: 0; padding: 4px; list-style: none;
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px #0006;
    }
    #theme-list[hidden] { display: none; }
    #theme-list li { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 5px; font-size: 14px; cursor: pointer; }
    #theme-list li[aria-selected="true"] { color: var(--accent); }
    #theme-list li.active { background: var(--line); }
    main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-top: 24px; padding-bottom: 16px; }
    .hints { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .hints span { color: var(--muted); font-size: 14px; margin-right: 4px; }
    .hints button {
      font: 13px/1 "JetBrainsMono Nerd Font Mono", ui-monospace, Menlo, Consolas, monospace;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 11px;
      cursor: pointer;
      transition: border-color 120ms, color 120ms;
    }
    .hints button:hover:not(:disabled), .hints button:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
    .hints button:disabled { opacity: 0.45; cursor: progress; }
    .panel {
      flex: 1;
      min-height: 440px;
      display: flex;
      background: var(--terminal);
      border-radius: 8px;
      padding: 14px 6px 6px 14px;
      overflow: hidden;
    }
    #terminal { flex: 1; min-width: 0; }
    #terminal .xterm, #terminal .xterm-viewport, #terminal .xterm-scrollable-element { background-color: var(--terminal) !important; }
    /* No focus ring inside the terminal; the blinking cursor shows focus. */
    #terminal .xterm:focus, #terminal .xterm :focus { outline: none; }
    footer { padding-bottom: 24px; color: var(--muted); font-size: 13px; }
    @media (max-width: 600px) {
      header { padding-top: 20px; }
      .pitch { font-size: 16px; }
      .panel { min-height: 380px; padding: 8px 2px 2px 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="title">Loading…</h1>
      <p class="pitch" id="pitch"></p>
    </div>
    <div class="tools">
      <a class="repo" id="repo" hidden>Source on GitHub</a>
      <button id="theme-button" type="button" aria-haspopup="listbox" aria-expanded="false" hidden><span class="swatch" id="theme-swatch"></span><span id="theme-name"></span></button>
      <ul id="theme-list" role="listbox" aria-label="Theme" tabindex="-1" hidden></ul>
    </div>
  </header>
  <main>
    <div class="hints" id="hints"><span>Try</span></div>
    <div class="panel"><div id="terminal"></div></div>
  </main>
  <footer id="disclosure">Runs entirely in your browser in a WebContainers Node.js sandbox.</footer>

  <script type="module">
    import { WebContainer } from "https://cdn.jsdelivr.net/npm/@webcontainer/api@1.6.4/+esm";

    // Start the slow parts at once and in parallel: the sandbox boot, the files, the config, the terminal code and the font.
    // The sandbox home is always /home/demo, so recipes can write absolute paths into their settings.
    const started = performance.now();
    const timings = {};
    const mark = (name) => { timings[name] = Math.round(performance.now() - started); };
    window.demoTimings = timings;
    const booting = crossOriginIsolated ? WebContainer.boot({ workdirName: "demo" }) : null;
    const filesLoad = fetch("files.json").then((response) => response.json()).then(decode);
    const configLoad = fetch("terminal.json").then((response) => response.json());
    const themesLoad = fetch("themes.json").then((response) => response.json()).catch(() => []);
    const terminalCode = Promise.all([
      import("https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/+esm"),
      import("https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/+esm"),
      import("https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/+esm"),
    ]);
    // Both weights before the terminal opens: xterm measures glyphs once and does not redraw when a font arrives.
    const mono = '"JetBrainsMono Nerd Font Mono"';
    const fontLoad = Promise.race([
      Promise.all([document.fonts.load(`14px ${mono}`), document.fonts.load(`bold 14px ${mono}`)]),
      new Promise((resolve) => setTimeout(resolve, 2500)),
    ]);

    const config = await configLoad;
    const seedLoad = config.seed ? import(new URL(config.seed, location.href)) : null;
    document.title = `${config.title}: try it in your browser`;
    document.getElementById("title").textContent = config.title;
    document.getElementById("pitch").textContent = config.pitch ?? "";
    if (config.repo) Object.assign(document.getElementById("repo"), { href: config.repo, hidden: false });
    if (config.disclosure) document.getElementById("disclosure").textContent = config.disclosure;
    const themes = await themesLoad;
    const storeKey = "browser-terminal.theme";
    const stored = (() => { try { return JSON.parse(localStorage.getItem(storeKey))?.name; } catch { return undefined; } })();
    const pick = (name) => themes.find((theme) => theme.name === name);
    let current = pick(stored) ?? pick(config.defaultTheme) ?? themes[0];
    // Bright ANSI colors are the normal ones lifted a quarter of the way toward the theme's brightest ink.
    const lift = (color, toward) => `#${[1, 3, 5].map((at) => Math.round(parseInt(color.slice(at, at + 2), 16) * 0.75 + parseInt(toward.slice(at, at + 2), 16) * 0.25).toString(16).padStart(2, "0")).join("")}`;
    const terminalColors = ({ terminal, ink, inkStrong, accent, line, ansi }) => ({
      background: terminal, foreground: ink, cursor: accent, cursorAccent: terminal, selectionBackground: line, selectionForeground: inkStrong,
      black: ansi.black, red: ansi.red, green: ansi.green, yellow: ansi.yellow, blue: ansi.blue, magenta: ansi.magenta, cyan: ansi.cyan, white: ansi.white,
      brightBlack: ansi.brightBlack, brightRed: lift(ansi.red, inkStrong), brightGreen: lift(ansi.green, inkStrong), brightYellow: lift(ansi.yellow, inkStrong),
      brightBlue: lift(ansi.blue, inkStrong), brightMagenta: lift(ansi.magenta, inkStrong), brightCyan: lift(ansi.cyan, inkStrong), brightWhite: ansi.brightWhite,
    });
    let term;
    // The sandbox learns the theme too: ~/.config/showcase/theme.json holds the page's colors and the terminal
    // palette, rewritten on every change, and the recipe's onTheme command can turn it into a program's own theme.
    let sandbox = null;
    let shared = Promise.resolve();
    let shareTimer;
    async function writeTheme(theme) {
      if (!sandbox || !theme) return;
      const { container, env } = sandbox;
      const { name, label, mode, page, ink, inkStrong, muted, accent, surface, line, terminal } = theme;
      await container.fs.mkdir(".config/showcase", { recursive: true });
      await container.fs.writeFile(".config/showcase/theme.json", `${JSON.stringify({ name, label, mode, page, ink, inkStrong, muted, accent, surface, line, terminal, palette: terminalColors(theme) }, null, 2)}\n`);
      if (config.onTheme) await run(container, config.onTheme, env);
    }
    function shareTheme(theme) {
      clearTimeout(shareTimer);
      // Arrow keys preview themes quickly; only the one the visitor rests on is written.
      shareTimer = setTimeout(() => { shared = shared.then(() => writeTheme(theme)).catch((error) => console.warn("onTheme failed", error)); }, 150);
    }
    // Page and terminal change together; xterm maps its palette onto whatever the programs print.
    function apply(theme, save) {
      const vars = { page: theme.page, ink: theme.ink, "ink-strong": theme.inkStrong, muted: theme.muted, accent: theme.accent, surface: theme.surface, line: theme.line, terminal: theme.terminal };
      for (const [name, value] of Object.entries(vars)) document.documentElement.style.setProperty(`--${name}`, value);
      document.documentElement.style.colorScheme = document.documentElement.dataset.theme = theme.mode;
      if (term) term.options.theme = terminalColors(theme);
      shareTheme(theme);
      if (save) try { localStorage.setItem(storeKey, JSON.stringify({ name: theme.name, mode: theme.mode, vars })); } catch {}
    }
    if (current) apply(current);

    const [[{ Terminal }, { WebglAddon }, { FitAddon }]] = await Promise.all([terminalCode, fontLoad]);
    term = new Terminal({
      cursorBlink: true,
      convertEol: true,
      fontFamily: `${mono}, ui-monospace, Menlo, Consolas, monospace`,
      fontSize: 14,
      lineHeight: 1.25,
      scrollback: 5000,
      theme: current ? terminalColors(current) : undefined,
    });
    const fit = new FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("terminal"));
    // GPU rendering; the DOM renderer takes over if WebGL is unavailable or its context is lost.
    try {
      const webgl = new WebglAddon();
      webgl.onContextLoss(() => webgl.dispose());
      term.loadAddon(webgl);
      timings.renderer = "webgl";
    } catch {
      timings.renderer = "dom";
    }
    fit.fit();
    mark("terminal");
    // The theme picker: arrows preview a theme in the page and the terminal, Enter keeps it, Esc puts the old one back.
    if (themes.length > 1) {
      const button = document.getElementById("theme-button");
      const list = document.getElementById("theme-list");
      const swatch = (theme) => [theme.page, theme.accent, theme.ink].map((color) => `<i style="background:${color}"></i>`).join("");
      const rows = themes.map((theme) => {
        const row = Object.assign(document.createElement("li"), { role: "option", innerHTML: `<span class="swatch">${swatch(theme)}</span><span>${theme.label}</span>` });
        row.dataset.name = theme.name;
        list.append(row);
        return row;
      });
      let chosen = current;
      let cursor = 0;
      const show = () => {
        document.getElementById("theme-swatch").innerHTML = swatch(current);
        document.getElementById("theme-name").textContent = current.label;
        rows.forEach((row) => row.setAttribute("aria-selected", String(row.dataset.name === current.name)));
      };
      const open = (isOpen) => {
        list.hidden = !isOpen;
        button.setAttribute("aria-expanded", String(isOpen));
        if (isOpen) { chosen = current; move(themes.indexOf(current)); list.focus(); }
      };
      const move = (index) => {
        cursor = (index + themes.length) % themes.length;
        rows.forEach((row, i) => row.classList.toggle("active", i === cursor));
        rows[cursor].scrollIntoView({ block: "nearest" });
        current = themes[cursor];
        apply(current);
        show();
      };
      const close = (keep) => {
        if (keep) apply(current, true); else { current = chosen; apply(current); }
        show();
        open(false);
        button.focus();
      };
      button.hidden = false;
      show();
      button.addEventListener("click", () => open(list.hidden));
      list.addEventListener("click", (event) => {
        const row = event.target.closest("li");
        if (row) { current = pick(row.dataset.name); close(true); }
      });
      list.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown") move(cursor + 1);
        else if (event.key === "ArrowUp") move(cursor - 1);
        else if (event.key === "Enter") close(true);
        else if (event.key === "Escape" || event.key === "Tab") close(false);
        else return;
        event.preventDefault();
      });
      document.addEventListener("click", (event) => { if (!list.hidden && !event.target.closest(".tools")) close(false); });
    }

    // For automated checks: the terminal text.
    window.terminalText = () => {
      const buffer = term.buffer.active;
      return Array.from({ length: buffer.length }, (_, row) => buffer.getLine(row)?.translateToString(true) ?? "").join("\n");
    };

    const dim = (text) => `\x1b[2m${text}\x1b[0m`;
    const red = (text) => `\x1b[31m${text}\x1b[0m`;
    let input;
    const hints = document.getElementById("hints");
    for (const hint of config.hints ?? []) {
      const button = Object.assign(document.createElement("button"), { textContent: hint, disabled: true, title: `Run ${hint}` });
      button.addEventListener("click", () => {
        input?.write(`${hint}\r`);
        term.focus();
      });
      hints.append(button);
    }

    // Binary files arrive as base64 (see src/terminal.js).
    function decode(tree) {
      for (const node of Object.values(tree)) {
        if (node.directory) decode(node.directory);
        else if (node.file?.base64 !== undefined) node.file = { contents: Uint8Array.from(atob(node.file.base64), (char) => char.charCodeAt(0)) };
      }
      return tree;
    }

    function merge(tree, extra) {
      for (const [name, node] of Object.entries(extra)) {
        if (node.directory && tree[name]?.directory) merge(tree[name].directory, node.directory);
        else tree[name] = node;
      }
      return tree;
    }

    async function run(container, command, env) {
      const [name, ...args] = command.split(" ");
      const child = await container.spawn(name, args, { env });
      let output = "";
      child.output.pipeTo(new WritableStream({ write(data) { output += data; } }));
      const code = await child.exit;
      if (code !== 0) throw new Error(`'${command}' exited with ${code}\n${output}`);
      return output;
    }

    try {
      if (!booting) throw new Error("This page needs cross-origin isolation (COOP/COEP headers) to run the sandbox.");
      term.write(dim("Booting a Node.js sandbox in your browser…"));
      const [container, files, seedModule] = await Promise.all([booting, filesLoad, seedLoad]);
      mark("boot");
      // A recipe's seed adds files computed at visit time (dates relative to today) without starting a process.
      await container.mount(seedModule ? merge(files, seedModule.default(files)) : files);
      mark("mount");
      const home = container.workdir;
      // Env values may use ~ for the sandbox home and $PATH for the default PATH (which costs one extra process).
      const values = Object.entries(config.env ?? {});
      const basePath = values.some(([, value]) => value.includes("$PATH"))
        ? (await run(container, "node -p process.env.PATH", {})).trim()
        : "/usr/local/bin:/usr/bin:/bin";
      const expand = (value) => value.replace(/(^|:)~(?=\/|:|$)/g, `$1${home}`).replace("$PATH", basePath);
      const env = { HOME: home, PATH: basePath, ...Object.fromEntries(values.map(([key, value]) => [key, expand(value)])) };
      sandbox = { container, env };
      // Setup runs while the shell starts; the shell itself never needs the seeded files.
      const steps = config.setup ?? [];
      let progress = "Getting ready";
      const setup = (async () => {
        // The theme is in place before setup, so whatever setup or start launches reads it.
        await writeTheme(current);
        for (const [index, command] of steps.entries()) {
          progress = `Setting up the sandbox (${index + 1}/${steps.length})`;
          await run(container, command, env);
        }
        mark("setup");
      })();

      term.reset();
      term.write(`${(config.welcome ?? []).join("\n")}\n\n`);
      // Until setup is done the shell is held back: a spinner stands in for its prompt and keys are dropped,
      // so nothing typed early ends up in front of the start command.
      let shellOpen = false;
      let held = "";
      let typedEarly = false;
      const frames = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
      let frame = 0;
      const spin = () => term.write(`\r\x1b[2K${dim(`${frames[frame++ % frames.length]} ${progress}…${typedEarly ? "  Typing opens once this is done." : ""}`)}`);
      spin();
      const spinner = setInterval(spin, 80);
      const openShell = () => {
        clearInterval(spinner);
        term.write(`\r\x1b[2K${held}`);
        shellOpen = true;
      };
      const shell = await container.spawn("jsh", { env, terminal: { cols: term.cols, rows: term.rows } });
      let prompted;
      const firstPrompt = new Promise((resolve) => { prompted = resolve; }).then(() => mark("prompt"));
      shell.output.pipeTo(new WritableStream({
        write(data) {
          if (shellOpen) term.write(data); else held += data;
          prompted();
        },
      }));
      // Buttons wait for the first prompt and the setup, so a click never runs ahead of either.
      Promise.all([firstPrompt, setup]).then(() => {
        openShell();
        // The recipe's start command is typed into the shell, so the visitor sees what launched and can run it again.
        if (config.start) input.write(`${config.start}\r`);
        for (const button of hints.querySelectorAll("button")) button.disabled = false;
        mark("ready");
        window.demoReady = true;
      }, (error) => {
        openShell();
        term.write(red(`\nSetup failed: ${error.message}\n`));
        window.demoError = error.message;
      });
      input = shell.input.getWriter();
      term.onData((data) => {
        if (shellOpen) input.write(data);
        else typedEarly = true;
      });
      new ResizeObserver(() => {
        fit.fit();
        shell.resize({ cols: term.cols, rows: term.rows });
      }).observe(document.querySelector(".panel"));
      term.focus();
    } catch (error) {
      term.write(red(`\n${error.message}\n`));
      if (/SharedArrayBuffer|isolation|WebContainer/i.test(error.message)) {
        term.write(dim("Try a recent Chrome, Edge or Firefox on a desktop. Safari support is partial.\n"));
      }
      window.demoError = error.message;
    }
  </script>
</body>
</html>
